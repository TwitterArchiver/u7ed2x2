  苹果有很多功能，我在发布会看到觉得一般，但真正用起来就离不开…
  <br/>
  <br/>
  首先是灵动岛。当时只觉得刘海变小了，而且通知还不能上岛…结果现在控制音乐、看倒计时和外卖进度，全都都在长按药丸而不是下拉通知/控制中心...
  <br/>
  <br/>
  还有实况文本。当时认为市面上的 OCR App 那么多，我自己还有白描会员，用处不大。后来发现相册里的照片直接长按复制文字，比打开 App 选照片、等识别、再长按复制方便多了，而且 Safari 里出现的图片也能这么操作...
